server:
  port: ${PORT}

springdoc:
  #  /v3/api-docs.yaml для скачивания
  swagger-ui:
    path: /swagger-ui.html

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  datasource:
    url: ${JDBC_DATABASE_URL}
    username: ${JDBC_DATABASE_USERNAME}
    password: ${JDBC_DATABASE_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health
      cors:
        allowed-origins: "*"
        allowed-methods: "*"
        allowed-headers: "*"

security:
  admin_login:  ${ADMIN_LOGIN}
  admin_password:  ${ADMIN_PASSWORD}
